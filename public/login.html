<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="login.title">Cursor Bridge — Login</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="page-login">
    <main class="card">
      <h1>Cursor Bridge</h1>
      <p class="muted" data-i18n="login.lead">
        Join the shared room with your name and the team password.
      </p>
      <form id="login-form">
        <label for="displayName" data-i18n="login.name">Your name</label>
        <input
          id="displayName"
          name="displayName"
          type="text"
          autocomplete="nickname"
          maxlength="40"
          required
          autofocus
          data-i18n-placeholder="login.namePlaceholder"
          placeholder="e.g. Ana"
        />
        <label for="password" data-i18n="login.password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" data-i18n="login.submit">Enter room</button>
        <p id="error" class="error" hidden></p>
      </form>
    </main>
    <script type="module">
      import { t, applyI18n } from "./i18n.js?v=3";

      applyI18n();

      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("error");
      const savedName = localStorage.getItem("bridgeDisplayName") || "";
      if (savedName) document.getElementById("displayName").value = savedName;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        const displayName = document.getElementById("displayName").value.trim();
        const password = document.getElementById("password").value;
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, displayName }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || t("login.failed");
          errorEl.hidden = false;
          return;
        }
        localStorage.setItem("bridgeDisplayName", displayName);
        location.href = "/chat";
      });
    </script>
  </body>
</html>
