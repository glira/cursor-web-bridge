<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="login.title">Cursor Bridge — Login</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="page-login">
    <main class="card">
      <h1>Cursor Bridge</h1>
        <p class="muted" data-i18n="login.lead">
          Sign in with the username and password an admin created for you.
        </p>
        <form id="login-form">
          <label for="username" data-i18n="login.username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            maxlength="32"
            required
            autofocus
          />
        <label for="password" data-i18n="login.password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" data-i18n="login.submit">Enter room</button>
        <p id="error" class="error" hidden></p>
      </form>
    </main>
    <script type="module">
      import { t, applyI18n } from "./i18n.js?v=7";

      applyI18n();

      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("error");
      const savedName = localStorage.getItem("bridgeUsername") || "";
      if (savedName) document.getElementById("username").value = savedName;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || t("login.failed");
          errorEl.hidden = false;
          return;
        }
        localStorage.setItem("bridgeUsername", username);
        location.href = "/chat";
      });
    </script>
  </body>
</html>
